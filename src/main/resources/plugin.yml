name: BoltExtension
version: ${version}
main: com.noasaba.boltextension.BoltExtension
api-version: "26.1"
authors: [ "noasaba" ]
description: "Bolt + WorldEdit + WorldGuard で保護の一括操作"
depend: [ "WorldEdit", "Bolt", "WorldGuard" ]

commands:
  boltext:
    description: "WorldEdit範囲内のBolt保護を一括操作・診断"
    usage: "/boltext <public|private|set|transfer|unlock|access|entity|user|audit|inspect|scan|admin|confirm|debug> [args...]"

permissions:
  bolt.extension.use:
    default: false
    description: "一般操作権限の親ノード"
    children:
      bolt.extension.private: true
      bolt.extension.public: true
      bolt.extension.set: true
      bolt.extension.transfer: true
      bolt.extension.unlock: true
      bolt.extension.access.add: true
      bolt.extension.access.remove: true
      bolt.extension.entity.set: true
      bolt.extension.entity.transfer: true
      bolt.extension.entity.unlock: true
  bolt.extension.private:
    default: false
    description: "private保護の一括作成・変更"
  bolt.extension.set:
    default: false
    description: "任意のBolt protection typeへの一括作成・変更"
  bolt.extension.public:
    default: false
    description: "public保護の一括作成・変更"
  bolt.extension.transfer:
    default: false
    description: "自分の保護の一括譲渡"
  bolt.extension.unlock:
    default: false
    description: "自分の保護の一括解除"
  bolt.extension.access.add:
    default: false
    description: "自分の保護にアクセスを追加"
  bolt.extension.access.remove:
    default: false
    description: "自分の保護からアクセスを削除"
  bolt.extension.entity.set:
    default: false
    description: "選択範囲内のEntity保護を作成・変更"
  bolt.extension.entity.transfer:
    default: false
    description: "自分がownerのEntity保護を一括譲渡"
  bolt.extension.entity.unlock:
    default: false
    description: "自分がownerのEntity保護を一括解除"
  bolt.extension.scan:
    default: false
    description: "一般操作をdry-runで事前確認する権限"
  bolt.extension.inspect:
    default: op
    description: "ブロックのBolt/WorldGuard判定を診断する権限"
  bolt.extension.debug:
    default: op
    description: "依存関係や設定のデバッグ情報を確認する権限"
  bolt.extension.audit:
    default: op
    description: "不正な既存Protectionを監査"
  bolt.extension.admin.unlock:
    default: op
    description: "他人の保護を確認付きで解除する権限"
  bolt.extension.admin.access:
    default: op
    description: "他人の保護のアクセスを管理するための予約権限"
