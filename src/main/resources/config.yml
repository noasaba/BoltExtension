# BoltExtension 2.x configuration

# Maximum WorldEdit selection volume. Set to 0 or lower for unlimited.
max-volume: 1000000

# Admin confirmation lifetime.
confirmation-timeout-seconds: 60

worldguard:
  enabled: true

  # Default when bolt-extension-allow is not explicitly set on a region.
  flag-default: true

  # Allow normal commands outside all WorldGuard regions.
  allow-no-region: false

  # Require WorldGuard's effective BUILD flag to allow the operation.
  require-build-access: true

  # Require the player to be an owner/member of every overlapping region.
  # The __global__ region is treated as policy-only and is excluded.
  require-membership: true

  # Honor worldguard.region.bypass.<world> and worldguard.region.bypass.*.
  honor-bypass-permission: true

logging:
  # Log operation IDs, selections, dry-run state, and summaries.
  debug: false

  # Maximum detailed block errors logged and shown per operation.
  max-errors: 10
